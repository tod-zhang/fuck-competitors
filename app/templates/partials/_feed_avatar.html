<span class="monogram no-fav" style="background:{{ c.color }};width:22px;height:22px;border-radius:6px;font-size:11px">{% if c.favicon %}<img class="favicon" src="{{ c.favicon }}" alt="" referrerpolicy="no-referrer" onload="this.closest('.monogram').classList.remove('no-fav')" onerror="this.remove()">{% endif %}<span class="letter">{{ c.monogram }}</span></span>
